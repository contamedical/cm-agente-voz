name: pipeline
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
env:
  IMAGEM: ghcr.io/contamedical/cm-agente-voz
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: dependências
        run: pip install -r requirements.txt pytest
      - name: testes
        run: python -m pytest -q test/
  imagem:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: imagem
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao
    concurrency: { group: deploy-producao-cm-agente-voz, cancel-in-progress: false }
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/docker/cm-agente-voz' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_DIR
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            docker compose pull agente
            docker compose up -d --remove-orphans agente
            sleep 10
            estado=$(docker inspect -f '{{.State.Status}}' cm-agente-voz)
            echo "cm-agente-voz: $estado"
            docker logs --tail 20 cm-agente-voz
            [ "$estado" = "running" ]
            docker image prune -f
